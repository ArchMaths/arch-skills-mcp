<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100">
  <title>Animated orbit</title>
  <style>
    @keyframes pulse { from { fill: #f59e0b; } to { fill: #ef4444; } }
    .satellite { animation: pulse 2s linear infinite alternate; }
  </style>
  <rect width="160" height="100" rx="8" fill="#0f172a"/>
  <ellipse cx="80" cy="50" rx="30" ry="30" fill="none" stroke="#64748b" stroke-width="1"/>
  <circle cx="80" cy="50" r="10" fill="#38bdf8"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 80 50" to="360 80 50" dur="2s" repeatCount="indefinite"/>
    <circle class="satellite" cx="110" cy="50" r="5" fill="#f59e0b"/>
  </g>
</svg>
